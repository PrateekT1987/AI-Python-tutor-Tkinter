name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tk and Xvfb (for the GUI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Byte-compile the Python modules
        run: python -m compileall -q config.py content.py llm.py prompts.py sandbox.py settings.py server.py ui

      - name: Check the launcher script
        run: bash -n run_tutor.sh

      - name: Run the test suite
        run: xvfb-run -a python -m pytest

  frontend:
    name: Browser console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
